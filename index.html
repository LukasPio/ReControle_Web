<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Recontrole</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" href="assets/recontrole_logo_icon.png" />
    <script type="module" src="js/services.js"></script>
    <script type="module" src="js/pass_visibility.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="container-left" id="login-form">
        <section class="up-section">
          <div class="form-header">
            <p class="login-title">Login</p>
            <p class="slogan">Onde a manutenção<br />toma forma</p>
            <p class="welcome-text">Bem-vindo de volta</p>
          </div>
          <img
            src="assets/rec_logo_2.png"
            alt="Logo REcontrole"
            class="secondary-logo">
        </section>
        <form class="form-content">
          <div class="input-group">
            <label for="login-email" class="input-label"
              >Insira seu email</label
            >
            <input
              type="email"
              name="login-email"
              id="login-email"
              class="form-input"
              placeholder="exemplo@email.com"
            />
          </div>

          <div class="input-group">
            <label for="login-password" class="input-label"
              >Insira sua senha</label
            >
            <div class="password-container">
              <input
                type="password"
                name="login-password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
              />
              <span class="toggle-password" id="toggle-password"><svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#666666"><path d="M480-312q70 0 119-49t49-119q0-70-49-119t-119-49q-70 0-119 49t-49 119q0 70 49 119t119 49Zm0-72q-40 0-68-28t-28-68q0-40 28-68t68-28q40 0 68 28t28 68q0 40-28 68t-68 28Zm0 192q-142.6 0-259.8-78.5Q103-349 48-480q55-131 172.2-209.5Q337.4-768 480-768q142.6 0 259.8 78.5Q857-611 912-480q-55 131-172.2 209.5Q622.6-192 480-192Zm0-288Zm0 216q112 0 207-58t146-158q-51-100-146-158t-207-58q-112 0-207 58T127-480q51 100 146 158t207 58Z"/></svg></span>
            </div>
          </div>
          <div class="form-options">
            <label class="checkbox-container">
              <input
                type="checkbox"
                name="checkbox"
                class="checkbox"
                id="checkbox"
              />
              <span class="checkmark"></span>
              Lembrar de mim
            </label>
            <a href="./html/Email_rec.html" class="forgot-password"
              >Esqueceu sua senha?</a
            >
          </div>

          <div class="form-buttons">
            <button type="button" id="login-button" class="btn btn-primary">
              Login
            </button>
          </div>
        </form>

        <p class="register-text">
          Não tem uma conta? <a href="./html/cadastro.html" id="register-link">Cadastre-se</a>
        </p>
      </div>
      <div class="container-right">
        <img
        src="assets/rec_logo_2.png"
        alt="Logo REcontrole"
        class="logo-recontrole">
      </div>
    </div>
  </body>
</html>
