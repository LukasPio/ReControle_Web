<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Recontrole</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" href="assets/recontrole_logo_icon.png" />
    <script type="module" src="js/services.js"></script>
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="container-left" id="login-form">
        <div class="form-header">
          <p class="login-title">Login</p>
          <p class="slogan">Onde a manutenção<br />toma forma</p>
          <p class="welcome-text">Bem-vindo de volta</p>
        </div>
        <form class="form-content">
          <div class="input-group">
            <label for="login-email" class="input-label"
              >Insira seu email</label
            >
            <input
              type="email"
              name="login-email"
              id="login-email"
              class="form-input"
              placeholder="exemplo@email.com"
            />
          </div>

          <div class="input-group">
            <label for="login-password" class="input-label"
              >Insira sua senha</label
            >
            <div class="password-container">
              <input
                type="password"
                name="login-password"
                id="login-password"
                class="form-input"
                placeholder="••••••••"
              />
              <span class="toggle-password" id="toggle-password"><svg xmlns="http://www.w3.org/2000/svg" height="10px" viewBox="0 -960 960 960" width="24px" fill="#000"><path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"/></svg></span>
            </div>
          </div>
          <div class="form-options">
            <label class="checkbox-container">
              <input
                type="checkbox"
                name="checkbox"
                class="checkbox"
                id="checkbox"
              />
              <span class="checkmark"></span>
              Lembrar de mim
            </label>
            <a href="./html/Email_rec.html" class="forgot-password"
              >Esqueceu sua senha?</a
            >
          </div>

          <div class="form-buttons">
            <button type="button" id="login-button" class="btn btn-primary">
              Login
            </button>
          </div>
        </form>

        <p class="register-text">
          Não tem uma conta? <a href="./html/cadastro.html" id="register-link">Cadastre-se</a>
        </p>
      </div>
      <div class="container-right">
        <img
        src="assets/rec_logo_2.png"
        alt="Logo REcontrole"
        class="logo-recontrole"
      />
    </div>


    <script src="js/index-transitions.js"></script>
  </body>
</html>
