<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Recontrole</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" href="assets/recontrole_logo_icon.png" />
    <script type="module" src="js/services.js"></script>
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="container-right">
        <div class="container-left" id="login-form">
          <div class="form-header">
            <p class="login-title">Login</p>
            <p class="slogan">Onde a manutenção<br />toma forma</p>
            <p class="welcome-text">Bem-vindo de volta</p>
          </div>

          <form class="form-content">
            <div class="input-group">
              <label for="login-email" class="input-label"
                >Insira seu email</label
              >
              <input
                type="email"
                name="login-email"
                id="login-email"
                class="form-input"
                placeholder="exemplo@email.com"
              />
            </div>

            <div class="input-group">
              <label for="login-password" class="input-label"
                >Insira sua senha</label
              >
              <div class="password-container">
                <input
                  type="password"
                  name="login-password"
                  id="login-password"
                  class="form-input"
                  placeholder="••••••••"
                />
                <span class="toggle-password" id="toggle-password">👁️</span>
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-container">
                <input
                  type="checkbox"
                  name="checkbox"
                  class="checkbox"
                  id="checkbox"
                />
                <span class="checkmark"></span>
                Lembrar de mim
              </label>
              <a href="Email_rec.html" class="forgot-password"
                >Esqueceu sua senha?</a
              >
            </div>

            <div class="form-buttons">
              <button type="button" id="login-button" class="btn btn-primary">
                Login
              </button>
              <button
                type="button"
                id="sign-up-button"
                class="btn btn-secondary"
              >
                Registrar
              </button>
            </div>
          </form>

          <p class="register-text">
            Não tem uma conta? <a href="#" id="register-link">Cadastre-se</a>
          </p>
        </div>
        <img
        src="assets/rec_logo_2.png"
        alt="Logo REcontrole"
        class="logo-recontrole"
      />
    </div>


    <script src="js/index-transitions.js"></script>
  </body>
</html>
