<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Recontrole</title>
    <link rel="icon" href="../assets/recontrole_logo_icon.png" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <!-- Chart.js e SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <!-- Módulos de serviço e autenticação -->
    <script type="module" src="../js/services.js" defer></script>
    <script type="module" src="../js/main_services.js" defer></script>
    <script type="module" src="../js/home.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <h2 class="logo"><span style="color: #2f5cf3">Re</span>Controle</h2>
      <nav>
        <ul id="link-side">
          <li id="home" class="active">Visão Geral</li>
          <li id="calls">Chamados</li>
        </ul>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div class="search-div">
          <input type="search" placeholder="Search..." id="search-anyt" />
          <!--<ul class="search-ul">
            <li class="search-li">
              aqui
            </li>
          </ul>-->
        </div>
        <div class="actions">
          <img src="../assets/bell-icon.png" alt="Notificações" />
          <div class="account-dropdown">
            <div class="account-toggle" id="account-toggle">
              <span class="account-name" id="accountName"></span>
              <img
                src="../assets/avatar.png"
                id="user-img"
                alt="Foto de Perfil"
                class="account-img"
              />
            </div>
            <ul class="account-menu" id="accountMenu">
              <li><a href="#" id="name"></a></li>
              <li><a href="#" id="logout">Fazer Logout</a></li>
            </ul>
          </div>
        </div>
      </header>

      <section class="dashboard">
        <h1>Visão Geral</h1>
        <aside>
          <div class="link-chamados-div">
            <nav>
              <h2>Chamados recentes</h2>
              <ul  align="right" ><a href="./calls.html"><svg  xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#434343"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg></a></ul>
            </nav>
          </div>
        </aside>
        

        <div class="chamados" id="chamados">
        </div>
        <div class="grafico-box">
          <h2>Chamados Resolvidos</h2>
          <canvas id="graficoLinha"></canvas>
        </div>
      </section>
    </main>
    
  </body>
</html>
