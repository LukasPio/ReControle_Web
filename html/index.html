<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="icon" href="../assets/recontrole_logo_icon.png">
    <!--<script type="module" src="../js/index.js"></script>-->
    <script type="module" src="../js/services.js"></script>
</head>
<body> 

    <div class="container">
        <div class="container-right">
            <div class="container-left">
                <p class="login-title">Login</p>
                <p class="slogan">Onde a manutenção<br>toma forma</p>
                <p class="litlle-texts">Bem-vindo de volta</p>
                
                <label for="login-email" class="litlle-texts">Insira seu email</label>
                <input type="email" name="login-email" id="login-email">
                <label for="login-password" class="litlle-texts">Insira sua senha</label>
                <input type="password" name="login-password" id="login-password">
                
                <div class="subcontainer">
                    <label class="label-checkbox">
                        <input type="checkbox" name="checkbox" value="value" class="checkbox" id="checkbox">
                        Lembrar de mim
                    </label>
                    <a href="Email_rec.html" class="litlle-texts">Esqueceu sua senha?</a>
                </div>
                <div class="buttons">
                    <input type="button" name="login-button" id="login-button" value="Login">
                    <input type="button" name="sign-up-button" id="sign-up-button" onclick="window.location.href='cadastro.html'" value="Registrar">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
