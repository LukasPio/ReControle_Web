<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conta | ReControle</title>
    <link rel="stylesheet" href="../css/H_config_acc.css" />
    <script type="module" src="../js/H_config_acc.js" defer></script>
    <link rel="icon" href="../assets/recontrole_logo_icon.png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light-mode";
        const savedColor = localStorage.getItem("primaryColor") || "#007bff";

        document.body.classList.add(savedTheme);
        document.documentElement.style.setProperty(
          "--primary-color",
          savedColor
        );
      });
    </script>
  </head>
  <body>
    <div class="config-container">
      <button id="back" class="btn-back">Voltar</button>

      <div class="config-inner">
        <nav class="config-aside">
          <ul class="tab-list">
            <li>
              <button
                id="perfil"
                class="tab-button"
                data-src="iframes/perfil.html"
              >
                Perfil
              </button>
            </li>
            <li>
              <button
                id="seguranca"
                class="tab-button"
                data-src="iframes/seguranca.html"
              >
                Segurança
              </button>
            </li>
            <li>
              <button id="tema" class="tab-button" data-src="iframes/tema.html">
                Tema
              </button>
            </li>
          </ul>
        </nav>

        <!-- Área de conteúdo -->
        <section class="config-content">
          <iframe
            id="exibir"
            name="exibir"
            src="iframes/perfil.html"
            title="Conteúdo da Configuração"
          ></iframe>
        </section>
      </div>
    </div>
  </body>
</html>
