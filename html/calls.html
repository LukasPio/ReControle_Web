<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamados | ReControle</title>
    <link rel="icon" href="../assets/recontrole_logo_icon.png" />
    <link rel="stylesheet" href="../css/calls.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
    <!-- Chart.js e SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <!-- Módulos de serviço e autenticação -->
    <script type="module" src="../js/services.js" defer></script>
    <script type="module" src="../js/main_services.js" defer></script>
    <script type="module" src="../js/calls.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <h2 class="logo"><span style="color: #2f5cf3">Re</span>Controle</h2>
      <nav>
        <ul id="link-side">
          <li id="home">Visão Geral</li>
          <li id="calls" class="active">Chamados</li>
          <li id="institution">Instituição</li>
        </ul>
      </nav>
    </aside>
 
    <main>
      <header class="topbar">
        <input type="search" placeholder="Search..." id="search-anyt" />
        <div class="actions">
          <div class="account-dropdown">
            <div class="account-toggle" id="account-toggle">
              <span class="account-name" id="accountName"></span>
              <img
                src="../assets/avatar.png"
                id="user-img"
                alt="Foto de Perfil"
                class="account-img"
              />
            </div>
            <ul class="account-menu" id="accountMenu">
              <li><a href="#" id="name"></a></li>
              <li><a href="#" id="logout">Fazer Logout</a></li>
            </ul>
          </div>
        </div>
      </header>

      <section class="dashboard" id="main">
        <h1>Chamados</h1><br>
        <div id="chamados">
          <div id="red" class="chamados"></div>
          <div id="yellow" class="chamados"></div>
          <div id="green" class="chamados"></div>
        </div>
      </section>
      <div class="report-changes">
        <button class="btn-create-rep" id="reportButton">Criar Ocorrência</button>
      </div>
    </main>
  </body>
</html>
